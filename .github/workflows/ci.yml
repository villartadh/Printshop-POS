name: Printshop POS Full App CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  typecheck-unit-ui-api:
    name: Typecheck & Automated Suites (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ matrix.node-version }}-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run strict TypeScript check
        run: npm run typecheck

      - name: Run unit test suites
        run: npm run test:unit

      - name: Run React UI component test suites
        run: npm run test:ui

      - name: Run Express + SQLite API integration tests
        run: npm run test:api

      - name: Generate Vitest JUnit test report
        if: matrix.node-version == '22'
        run: npx vitest run --reporter=default --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Upload test report artifact
        if: always() && matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: test-results/vitest-junit.xml
          if-no-files-found: warn
          retention-days: 14

  build-and-e2e-smoke:
    name: Production Build & Full-Stack E2E Smoke
    needs: typecheck-unit-ui-api
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-npm-

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build production SPA & PWA bundle
        run: npm run build

      - name: Verify production bundle & PWA outputs
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Run live production server & SQLite E2E smoke test
        run: npm run test:e2e

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: printshop-pos-dist
          path: dist/
          retention-days: 7

      - name: Write workflow test summary
        if: always()
        run: |
          {
            echo "### Printshop POS Full App CI Summary"
            echo ""
            echo "- **Typecheck**: \`tsc --noEmit\` passed on Node 20 & 22"
            echo "- **Unit, UI & API Tests**: Vitest + React Testing Library + Supertest passed"
            echo "- **Production Build**: Vite + Workbox PWA (\`dist/index.html\`, \`dist/manifest.webmanifest\`, \`dist/sw.js\`) verified"
            echo "- **Full-Stack E2E Smoke**: Production Express server + isolated SQLite workflow verified"
          } >> "$GITHUB_STEP_SUMMARY"
