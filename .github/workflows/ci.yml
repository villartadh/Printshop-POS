name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    name: Typecheck, Vitest, Build & E2E Smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-22-npm-${{ hashFiles('package-lock.json', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-node-22-npm-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Run strict TypeScript check
        run: npm run typecheck

      - name: Run Vitest suite
        run: npm test -- --reporter=default --reporter=junit --outputFile=test-results/vitest-junit.xml

      - name: Upload Vitest JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit-report
          path: test-results/vitest-junit.xml
          if-no-files-found: warn
          retention-days: 14

      - name: Build production SPA & PWA bundle
        run: npm run build

      - name: Verify production bundle & PWA outputs
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js

      - name: Run full-stack production E2E smoke test
        run: npm run test:e2e

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: printshop-pos-dist
          path: dist/
          retention-days: 7
